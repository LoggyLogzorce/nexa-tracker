services:
  postgres:
    image: postgres:16-alpine
    container_name: tracker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexa_task_tracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tracker-backend
    environment:
      ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_HOST: tracker-postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: nexa_task_tracker
      DB_SSLMODE: disable
      JWT_SECRET: change-me-in-production
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      COOKIE_DOMAIN: .kivoapps.ru
      COOKIE_SAMESITE: 1
      CORS_ORIGINS: "https://tasks.kivoapps.ru:8443"
    volumes:
      - attachments:/var/data/nexa-tracker
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - shared-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: https://tasks.kivoapps.ru:8443/api
    container_name: tracker-frontend
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - shared-network

volumes:
  postgres-data:
  attachments:

networks:
  shared-network:
    external: true