version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexa_task_tracker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nexa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENV: development
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: nexa_task_tracker
      DB_SSLMODE: disable
      JWT_SECRET: change-me-in-production
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      COOKIE_DOMAIN: ""
      COOKIE_SAMESITE: 1
      CORS_ORIGINS: "http://localhost:3000,http://192.168.3.69:3000"
    volumes:
      - attachments:/var/data/nexa-tracker
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexa-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://192.168.3.69:8080
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - nexa-network

volumes:
  postgres-data:
  attachments:

networks:
  nexa-network:
    driver: bridge