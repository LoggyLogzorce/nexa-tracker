services:
  postgres:
    image: postgres:16-alpine
    container_name: tracker-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kivo_networks

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tracker-backend
    env_file:
      - ../.env
    volumes:
      - attachments:/var/data/nexa-tracker
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - kivo_networks

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: tracker-frontend
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - kivo_networks

volumes:
  postgres-data:
  attachments:

networks:
  kivo_networks:
    external: true